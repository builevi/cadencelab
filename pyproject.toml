[project]
name = "sociallens-pro"
version = "0.2.0"
description = "Experimental social content diagnostics and conditional trend modeling"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
  "imageio-ffmpeg>=0.6,<1",
  "yt-dlp>=2026.1.1",
]

[project.optional-dependencies]
media = ["faster-whisper>=1.1,<2"]

[dependency-groups]
dev = ["httpx>=0.27,<1"]
build = ["pyinstaller>=6.16,<7"]

[tool.uv]
package = false
