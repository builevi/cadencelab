name: Desktop release builds
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload installers to the existing GitHub Release
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install uv
      - run: uv sync --locked --extra media --group dev --group build
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/desktop ci
      - run: node apps/desktop/node_modules/electron/install.js
      - run: uv run --extra media python -m unittest discover -s tests
      - run: npm --prefix apps/desktop test
      - run: uv run --extra media python scripts/prepare_video_models.py
      - run: uv run --extra media python scripts/desktop/build_frontend.py
      - run: uv run --extra media --group build python scripts/desktop/build_backend.py
      - run: npm --prefix apps/desktop run pack -- --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: uv run python scripts/desktop/smoke_app.py
      - run: npm --prefix apps/desktop run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cadencelab-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
      - name: Upload verified installers to existing release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./apps/desktop/package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ matrix.target }}" = "win" ]; then
              gh release upload "$TAG" release/*.exe --clobber
            else
              gh release upload "$TAG" release/*.dmg --clobber
            fi
          fi
