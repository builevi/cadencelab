name: Desktop release builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-15
            target: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv
      - run: uv sync --locked --extra media --group dev --group build
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/desktop ci
      - run: uv run --extra media python -m unittest discover -s tests
      - run: npm --prefix apps/desktop test
      - run: uv run --extra media python scripts/prepare_video_models.py
      - run: uv run --extra media python scripts/desktop/build_frontend.py
      - run: uv run --extra media --group build python scripts/desktop/build_backend.py
      - run: npm --prefix apps/desktop run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: uv run python scripts/desktop/smoke_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: cadencelab-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
      - name: Upload verified installers to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./apps/desktop/package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ matrix.target }}" = "win" ]; then
              gh release upload "$TAG" release/*.exe --clobber
            else
              gh release upload "$TAG" release/*.dmg --clobber
            fi
          fi
